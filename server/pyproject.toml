[project]
name = "digital-card-platform-server"
version = "0.1.0"
description = "FastAPI backend for digital business cards"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18.5",
  "fastapi[standard]",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings",
  "sqlmodel",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
