name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('client/src/**/*', 'client/*.config.*', 'client/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w client

      - name: Typecheck
        run: npm run typecheck -w client

      - name: Test
        run: npm run test -w client

      - name: Build
        run: npm run build -w client

  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: digital_cards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_cards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/digital_cards_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/digital_cards_test

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0  # To be changed to v8 when one will be available
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - client
      - server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "client=ghcr.io/${repository}/client" >> "$GITHUB_OUTPUT"
          echo "server=ghcr.io/${repository}/server" >> "$GITHUB_OUTPUT"

      - name: Prepare client build URL
        id: build-url
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "public_url=https://${DEPLOY_DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "public_url=http://localhost" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Client metadata
        id: client-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.client }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Server metadata
        id: server-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.server }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: client
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.client-meta.outputs.tags }}
          labels: ${{ steps.client-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.build-url.outputs.public_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.build-url.outputs.public_url }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && vars.ENABLE_DEPLOYMENT == 'true'

    steps:
      - name: Prepare deployment values
        id: deploy
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "client_image=ghcr.io/${repository}/client:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "server_image=ghcr.io/${repository}/server:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy containers
        shell: bash
        run: |
          : "${DEPLOY_DATABASE_URL:?DEPLOY_DATABASE_URL secret is required}"
          printf '%s' "$DEPLOY_CADDYFILE" > caddyfile.deploy
          printf '%s' "$DEPLOY_COMPOSE_FILE" > compose.deploy.yml
          deploy_database_url_b64="$(printf '%s' "$DEPLOY_DATABASE_URL" | base64 -w 0)"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" caddyfile.deploy compose.deploy.yml "$SSH_USER@$SSH_HOST:/tmp/"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            DEPLOY_DOMAIN="$DEPLOY_DOMAIN" \
            CLIENT_IMAGE="$CLIENT_IMAGE" \
            SERVER_IMAGE="$SERVER_IMAGE" \
            DEPLOY_DATABASE_URL_B64="$deploy_database_url_b64" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          app_dir="$HOME/digital-card-platform"
          mkdir -p "$app_dir"
          cd "$app_dir"
          database_url="$(printf '%s' "$DEPLOY_DATABASE_URL_B64" | base64 --decode)"

          install -m 600 /tmp/caddyfile.deploy Caddyfile
          install -m 600 /tmp/compose.deploy.yml compose.yml
          rm -f /tmp/caddyfile.deploy /tmp/compose.deploy.yml

          if docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif sudo -n docker info >/dev/null 2>&1 && sudo -n docker compose version >/dev/null 2>&1; then
            docker_cmd=(sudo docker)
          else
            echo "Docker with the Compose plugin is not available for ${USER}. Add the user to the docker group, allow passwordless sudo for docker, or install the Docker Compose plugin." >&2
            exit 1
          fi

          cat > .env <<ENV
          DOMAIN=${DEPLOY_DOMAIN}
          DATABASE_URL=${database_url}
          SERVER_PORT=4000
          CLIENT_ORIGIN=https://${DEPLOY_DOMAIN}
          INTERNAL_API_URL=http://server:4000
          NEXT_PUBLIC_API_URL=https://${DEPLOY_DOMAIN}
          NEXT_PUBLIC_SITE_URL=https://${DEPLOY_DOMAIN}
          CLIENT_IMAGE=${CLIENT_IMAGE}
          SERVER_IMAGE=${SERVER_IMAGE}
          ENV

          chmod 600 .env Caddyfile compose.yml
          "${docker_cmd[@]}" compose -f compose.yml --env-file .env pull
          "${docker_cmd[@]}" compose -f compose.yml --env-file .env up -d --remove-orphans
          "${docker_cmd[@]}" compose -f compose.yml --env-file .env ps
          "${docker_cmd[@]}" image prune -f
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_CADDYFILE: ${{ secrets.DEPLOY_CADDYFILE }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
          DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
          CLIENT_IMAGE: ${{ steps.deploy.outputs.client_image }}
          SERVER_IMAGE: ${{ steps.deploy.outputs.server_image }}

      - name: Verify deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 60 "https://${DEPLOY_DOMAIN}/api/health"
          curl --fail --silent --show-error --max-time 60 --output /dev/null "https://${DEPLOY_DOMAIN}/"
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
